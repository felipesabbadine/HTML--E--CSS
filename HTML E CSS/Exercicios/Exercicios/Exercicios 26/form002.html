<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 2</title>
    <style>
        input#ius {
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>
    <form action="cadastro.php" method="post">
        <p>
            <label for="ius">Usuario</label>
            <input type="text" name="ius" id="ius" minlength="8" maxlength="15" autocomplete="username">
        </p>
        <p>
            <label for="isen">Senha</label>
            <input type="password" name="isen" id="isen" min="8" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>

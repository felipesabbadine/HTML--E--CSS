<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>

    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas" value="M"> <label for="isxmas">Masculino</label>
            <br>
            <input type="radio" name="sexo" id="isxfem" value="F"><label for="isxfem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <p>
              <input type="checkbox" name="esbas" id="esbas"> <label for="esbas">Basquete</label>
              <br>
              <input type="checkbox" name="esfut" id="esfut"> <label for="esfut">Futebol</label>
              <br>
              <input type="checkbox" name="esnat" id="esnat"> <label for="esnat">Natação</label>
              <br>
              <input type="checkbox" name="esten" id="esten"> <label for="esten">Tenis</label>

            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>

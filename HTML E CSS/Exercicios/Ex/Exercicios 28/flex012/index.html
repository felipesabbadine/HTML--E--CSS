<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
        div.container {
            background-color: blue;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            
            
        }

        div#cxa {
            flex: 1 1 200px;
        }

        div#cxb {
            flex: 1 1 200px;
        }

        div#cxc {
            flex: 3 1 200px;
        }

        
    </style>
</head>
<body>
    <div class="container"> 
        <div class="item" id="cxa">1</div>
        <div class="item" id="cxb">2</div>
        <div class="item" id="cxc">3</div>
    </div>
    
</body>
</html>

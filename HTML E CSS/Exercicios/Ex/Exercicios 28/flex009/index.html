<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
        div.container {
            background-color: blue;
            display: flex;
            flex-flow: row wrap;

        }

        div.item {
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            flex-basis: 350px;
        }
    </style>
</head>
<body>
    <div class="container"> 
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">Item 4 que é bem grande</div>
        <div class="item">Item 5 que é ainda maior que o famoso item 4 bem grande</div>
        <div class="item">6</div>
        <div class="item">Item 7 que é ainda muito maior que o incrivel item 5 que é maior que o famoso item 4</div>
        <div class="item">8</div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
        div.container {
            background-color: blue;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
            
        }

        div#cxa {
            flex-shrink: 2;
            flex-grow: 1;
        }

        div#cxb {
            flex-shrink: 1;
            flex-grow: 0;
        }

        div#cxc {
            flex-shrink: 1;
            flex-grow: 3;
        }

        div.contain {
            background-color: crimson;
            display: flex;
            flex-flow: row nowrap;
        }

        div.itens {
            background-color: red;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
        }

        div#cxd {
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#cxe {
            flex-shrink: 0;
            flex-grow: 2;
        }

        div#cxf {
            flex-shrink: 1;
            flex-grow: 1;
        }

        div.conta {
            background-color: rgb(250, 225, 5);
            display: flex;
            flex-flow: row nowrap;
        }

        div.iten {
            background-color: lime;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
        }

        div#cxg {
            flex-shrink: 1;
            flex-grow: 3;
        }

        div#cxh {
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#cxi {
            flex-shrink: 2;
            flex-grow: 2;
        }
    </style>
</head>
<body>
    <div class="container"> 
        <div class="item" id="cxa">1</div>
        <div class="item" id="cxb">2</div>
        <div class="item" id="cxc">3</div>
    </div>
    <div class="contain">
        <div class="itens" id="cxd">4</div>
        <div class="itens" id="cxe">5</div>
        <div class="itens" id="cxf">6</div>
    </div>
    <div class="conta">
        <div class="iten" id="cxg">7</div>
        <div class="iten" id="cxh">8</div>
        <div class="iten" id="cxi">9</div>
    </div>
</body>
</html>

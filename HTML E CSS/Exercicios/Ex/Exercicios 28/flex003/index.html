<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
        div.container {
            background-color: rgb(0, 153, 255);
            height: 250px;
            display: flex;
            flex-flow: column wrap-reverse;
        }

        div.item {
            background-color: blue;
            border: 1px solid black;
            
            text-align: center;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container"> 
        <div class="item">Exemplo de número 1</div>
        <div class="item">Exemplo de número 2</div>
        <div class="item">Exemplo de número 3</div>
        <div class="item">Exemplo de número 4</div>
        <div class="item">Exemplo de número 5</div>
        <div class="item">Exemplo de número 6</div>
        <div class="item">Exemplo de número 7</div>
        <div class="item">Exemplo de número 8</div>
    </div>
</body>
</html>
